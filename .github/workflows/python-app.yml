name: Python application

# Trigger the workflow on push or pull request events to the "main" branch
on:
  push:
    branches: [ "main" ]  # Trigger when pushing to the "main" branch
  pull_request:
    branches: [ "main" ]  # Trigger on pull requests to "main"

permissions:
  contents: read  # Allow actions to access repository contents

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu image to run the job

    steps:
    # Checkout the repository
    - uses: actions/checkout@v4

    # Set up Python 3.10
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"  # Define Python version here

    # Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest  # Install linters and testing libraries
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi  # Install from requirements.txt if it exists

    # Lint the code with flake8
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Run tests using pytest
    - name: Test with pytest
      run: |
        pytest
